seed: 2026

experiment:
  variant: feature_history
  use_user_features: true
  use_video_features: true
  use_history: true

data:
  processed_dir: data/processed
  raw_dir: data/raw
  positive_column: is_click

evaluation:
  k_values: [50, 100]
  max_users: 5000

model:
  embedding_dim: 64
  hidden_dim: 128
  feature_dim: 16
  max_history: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  temperature: 0.07
  epochs: 10
  batch_size: 512
  device: cpu

artifacts_dir: artifacts
